[project]
name = "vision-chat"
version = "0.1.0"
description = "Local, stateful vision chat assistant - LangChain + llama.cpp + session memory, with a Chainlit web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "chainlit>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
